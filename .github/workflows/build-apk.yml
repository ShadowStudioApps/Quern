name: Build Quern Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build R8-Optimized Universal APK (Phone + Android TV)
        run: gradle assembleRelease --stacktrace

      # CI has no release keystore: this APK is debug-signed and only for testing.
      # Official, Shadow Studio-signed APKs are published on the Releases page.
      - name: Upload test APK (debug-signed)
        uses: actions/upload-artifact@v4
        with:
          name: Quern-TEST-BUILD-debug-signed
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7
